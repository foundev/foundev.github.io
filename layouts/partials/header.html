<header class="site-header">
  <div class="wrap wrap--wide header-inner">
    <a class="brand" href="{{ "" | relURL }}">
      <span class="brand-mark" aria-hidden="true">&#126;</span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      <a href="{{ "" | relURL }}">Posts</a>
      <a class="nav-tags" href="{{ "tags/" | relURL }}">Tags</a>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 14.4A8.4 8.4 0 1 1 9.6 4a6.7 6.7 0 0 0 10.4 10.4Z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
