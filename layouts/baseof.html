<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ with .Params.description | default site.Params.tagline }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1 class="project-name"><a href="{{ "" | relURL }}">{{ site.Title }}</a></h1>
      {{ with site.Params.tagline }}<h2 class="project-tagline">{{ . }}</h2>{{ end }}
    </header>
    <main class="content">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <p>{{ site.Params.author }} &middot; <a href="{{ "index.xml" | relURL }}">RSS</a></p>
    </footer>
  </div>
</body>
</html>
